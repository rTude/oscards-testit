name: Yksikkötestit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  vitest:
    name: Vitest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: oscards

    steps:
      - name: Hae lähdekoodi
        uses: actions/checkout@v4

      - name: Aseta Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: oscards/package-lock.json

      - name: Asenna riippuvuudet
        run: npm ci

      - name: Aja yksikkötestit
        run: npm test
